name: HelpDesk autotests
on:
  push:
  pull_request:

defaults:
  run:
    working-directory: practice4-helpdesk

jobs:
  unit-integration:
    name: Unit + Integration (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: practice4-helpdesk/package-lock.json
      - run: npm install
      - name: Unit and integration tests with coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage
          path: practice4-helpdesk/coverage/

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    needs: unit-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: practice4-helpdesk/package-lock.json
      - run: npm install
      - name: Start test server in background
        run: |
          nohup npm run start:test > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo " <- ready"; exit 0; fi
            sleep 1
          done
          echo "Server did not become healthy"; cat server.log; exit 1
      - name: Run Cypress
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: practice4-helpdesk/cypress/screenshots/
          if-no-files-found: ignore
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" || true
